name: Verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  source:
    name: Source checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test services and isolation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor-profiles bubblewrap mariadb-server
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo systemctl stop mariadb
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, gd
          coverage: none
          tools: none
      - run: node scripts/check-syntax.mjs
      - run: node --test tests/*.test.mjs
      - name: Verify PHP behavior in isolation
        run: sh tests/isolated-checks.sh php
      - name: Verify account changes, reaction upgrades and attachment uploads against MariaDB
        run: sh tests/isolated-checks.sh database
      - name: Verify Apache routing in isolation
        if: matrix.php == '8.5'
        run: sh tests/isolated-checks.sh apache

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Gitleaks and scan tracked history
        shell: bash
        run: |
          scanner_dir="$(mktemp -d)"
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --no-banner --redact=100 --log-opts='-m HEAD' .

  static-analysis:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: '0.12.15'
          enable-cache: false
      - name: Scan PHP and JavaScript
        shell: bash
        run: |
          uvx --python 3.12 semgrep@1.186.0 scan public_html \
            --no-git-ignore --config p/php --config p/javascript --metrics=off --disable-version-check \
            --max-target-bytes 5000000 --error --json |
            node -e 'const r = JSON.parse(require("node:fs").readFileSync(0, "utf8")); console.log("Findings: " + r.results.length + ", scan errors: " + r.errors.length); if (r.errors.length) process.exitCode = 1;'
