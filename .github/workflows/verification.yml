name: Verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  source:
    name: Source checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            image: docker.io/library/php@sha256:282fb93697061f8315ce27b522d9bdc8e72d6823316a3771eb30c116e6baec7c
          - php: '8.6'
            image: docker.io/library/php@sha256:74fd38efacd3f5230c16d9d997b27831acfe64ffb84da6fb0154dd9c7b90f449
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - run: node scripts/check-syntax.mjs
      - run: node --test tests/*.test.mjs
      - name: Verify the chat bootstrap in isolation
        env:
          PHP_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 33:33 \
            --mount "type=bind,source=$PWD/public_html,target=/project/public_html,readonly" \
            --mount "type=bind,source=$PWD/tests/chat-bootstrap.test.php,target=/project/tests/chat-bootstrap.test.php,readonly" \
            --entrypoint php "$PHP_IMAGE" -n /project/tests/chat-bootstrap.test.php

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Gitleaks and scan tracked history
        shell: bash
        run: |
          scanner_dir="$(mktemp -d)"
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --no-banner --redact=100 --log-opts='-m HEAD' .
